name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install -r workers/requirements.txt
      - run: python -m unittest discover -s workers/tests -v

  desk:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_ANON_KEY: desk-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install numpy==2.3.5 soundfile==0.14.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.desk.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-browser-results
          path: test-results/

  editor-browsers:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_ANON_KEY: desk-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install numpy==2.3.5 soundfile==0.14.0
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npx playwright test --config=playwright.editor-browsers.config.ts --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-cross-browser-results
          path: test-results/

name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Verify Python parity independent of shell working directory
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP" node --test "$GITHUB_WORKSPACE/tests/defaults.test.mjs" "$GITHUB_WORKSPACE/tests/podcast.test.mjs"
      - run: npm run typecheck
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install -r workers/requirements.txt
      - run: python -m unittest discover -s workers/tests -v

  desk:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_ANON_KEY: desk-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install numpy==2.3.5 soundfile==0.14.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.desk.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-browser-results
          path: test-results/

  editor-browsers:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_ANON_KEY: desk-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure audio fixture dependencies
        timeout-minutes: 5
        run: |
          if command -v ffmpeg && command -v ffprobe; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg libsndfile1
      - run: python -m pip install numpy==2.3.5 soundfile==0.14.0
      - run: python -c "import soundfile; assert soundfile.available_formats().get('WAV')"
      - run: npm ci
      - name: Bound browser dependency downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-editor-network >/dev/null <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
      - name: Install Firefox and WebKit
        timeout-minutes: 5
        run: npx playwright install --with-deps firefox webkit
      - name: Start audio output for headless Firefox
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=editor_test
          pactl set-default-sink editor_test
      - run: npm run build
      - run: npx playwright test --config=playwright.editor-browsers.config.ts --project=firefox --project=webkit
      - name: Repeat native video regression without retries
        run: npx playwright test --config=playwright.editor-browsers.config.ts --project=firefox --project=webkit --grep="Podcast fork preview" --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-cross-browser-results
          path: test-results/
